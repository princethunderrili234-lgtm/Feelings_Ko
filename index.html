<<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pwede Ba Kitang Ligawan?</title>
  <!-- Google Fonts for Pixel/Cute Style -->
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Envelope Screen -->
  <div class="envelope-container" id="envelopeContainer">
    <div class="envelope-card">
      <div class="envelope-seal">💌</div>
      <h2>May Sulat Para Sa'yo!</h2>
      <p>I-click para buksan</p>
    </div>
  </div>

  <!-- Main Question Window Screen (Initially Hidden) -->
  <div class="letter-container" id="letterContainer">
    <div class="letter-window">
      <h1 id="questionTitle">Pwede Ba Kitang Ligawan? 🐾</h1>
      
      <!-- Cat Image Section -->
      <div class="cat-graphic-box">
        <img id="catImg" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Cute Cat" class="cat-img">
      </div>

      <!-- Buttons Section -->
      <div class="button-group" id="buttonGroup">
        <button id="yesBtn" class="btn yes-btn">Oo Namn! 💕</button>
        <div class="no-btn-wrapper">
          <button id="noBtn" class="btn no-btn">Ayaw ko</button>
        </div>
      </div>

      <!-- Hidden Final Notes/Message (Appears when Yes is clicked) -->
      <div id="finalNote" class="final-note hidden">
        <h2>Yippie!! 🎉❤️</h2>
        <p>Salamat! Sobrang saya ko ngayon. 🥰</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
